<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKK STAYPOINT - แหล่งรวมที่พักกรุงเทพฯ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-brand">
            <svg class="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>รวมที่พักทั่วกรุงเทพ</span>
        </a>
        <div id="user-navigation" style="display: flex; align-items: center; gap: 12px;">
            <a href="register.php" class="btn btn-secondary-outline">สมัครสมาชิก</a>
            <a href="user_login.php" class="btn btn-secondary-outline">เข้าสู่ระบบ</a>
        </div>
    </div>
</nav>

<header class="hero-section">
    <div class="hero-content">
        <h1>ค้นพบที่พักถัดไปของคุณ</h1>
        <p>รวมรวมจุดพักผ่อน คอนโด โรงแรม และห้องพักใจกลางเมืองกรุงเทพมหานคร</p>

        <div class="filter-bar">
            <div class="filter-group filter-group--full">
                <label for="search-input">ค้นหาที่พัก</label>
                <input type="text" id="search-input" class="filter-input" placeholder="ชื่อที่พัก หรือที่อยู่" autocomplete="off">
            </div>

            <div class="filter-group">
                <label for="district-select">เลือกเขตพื้นที่</label>
                <select id="district-select">
                    <option value="">แสดงทั้งหมด</option>
                </select>
            </div>

            <div class="filter-group">
                <label id="amenity-label">สิ่งอำนวยความสะดวก</label>
                <div class="multi-select" id="amenity-select">
                    <button type="button" class="multi-select__toggle" id="amenity-toggle" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="amenity-label">
                        <span id="amenity-summary">เลือกสิ่งอำนวยความสะดวก</span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="multi-select__menu" id="amenity-menu" role="listbox" aria-multiselectable="true" hidden></div>
                </div>
            </div>

            <div class="filter-group filter-group--full price-section">
                <div class="price-slider-col">
                    <label class="price-title">ราคาต่อคืน</label>
                    <div class="range-slider">
                        <div class="range-track"></div>
                        <div class="range-track-fill" id="range-track-fill"></div>
                        <input type="range" id="min-price-slider" min="0" max="10000" step="100" value="0" aria-label="ราคาต่ำสุด">
                        <input type="range" id="max-price-slider" min="0" max="10000" step="100" value="10000" aria-label="ราคาสูงสุด">
                    </div>
                </div>
                <div class="price-range-values">
                    <div class="price-labels">
                        <span id="price-min-label">เริ่มต้น 0 บาท</span>
                        <span id="price-max-label">สูงสุด 0 บาท</span>
                    </div>
                    <div class="price-inputs-row">
                        <div class="price-input-wrap">
                            <span class="currency">฿</span>
                            <input type="number" id="price-min-input" class="price-number-input" value="0" step="100" min="0" aria-label="ราคาเริ่มต้น">
                        </div>
                        <div class="price-connector"></div>
                        <div class="price-input-wrap">
                            <span class="currency">฿</span>
                            <input type="number" id="price-max-input" class="price-number-input" value="0" step="100" min="0" aria-label="ราคาสูงสุด">
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="search-btn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    ค้นหา
                </button>
                <button type="button" class="btn btn-secondary" id="reset-btn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    รีเซ็ตทั้งหมด
                </button>
                <button type="button" class="btn btn-secondary-outline" id="nearby-btn" aria-pressed="false">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span id="nearby-label">ใกล้ตัวฉัน (10 กม.)</span>
                </button>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div class="section-header">
        <h2>ที่พักแนะนำในกรุงเทพฯ</h2>
        <div class="divider"></div>
    </div>
    
    <div class="grid" id="accommodation-list"></div>
</main>

<script>
    // Five Server serves only static files. When it is used (normally on port
    // 5500), requests must go to the PHP API hosted by Apache/XAMPP instead.
    const isFiveServer = location.port === '5500';
    const appBaseUrl = isFiveServer
        ? `${location.protocol}//${location.hostname}/CODEPROJECT/`
        : new URL('.', location.href).href;
    const appUrl = path => new URL(path, appBaseUrl).href;
    const apiUrl = appUrl('api.php');

    document.querySelectorAll('#user-navigation a').forEach(link => {
        link.href = appUrl(link.getAttribute('href'));
    });

    // หน้าแรกเป็น HTML ล้วน จึงขอข้อมูลการล็อกอินจาก API แทนการฝัง PHP ไว้ในหน้าเว็บ
    fetch(`${apiUrl}?action=get_session`, { credentials: 'include' })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(session => {
            if (!session.logged_in) return;

            const nav = document.getElementById('user-navigation');
            nav.replaceChildren();

            const greeting = document.createElement('span');
            greeting.style.cssText = 'color: #64748B; font-size: 0.9rem;';
            const roleLabel = session.user_role === 'owner' ? 'เจ้าของที่พัก' : 'ผู้ใช้';
            greeting.textContent = `สวัสดี, ${session.user_name} (${roleLabel})`;
            nav.append(greeting);

            if (session.user_role === 'owner') {
                const dashboard = document.createElement('a');
                dashboard.href = appUrl('owner_dashboard.php');
                dashboard.className = 'btn btn-secondary-outline';
                dashboard.textContent = 'แดชบอร์ดของฉัน';
                nav.append(dashboard);
            }

            const logout = document.createElement('a');
            logout.href = appUrl('logout.php');
            logout.className = 'btn btn-secondary-outline';
            logout.textContent = 'ออกจากระบบ';
            nav.append(logout);
        })
        .catch(() => {});

    const $ = id => document.getElementById(id);
    const escapeHtml = str => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // โหลดเขตมาใส่ dropdown
    fetch(`${apiUrl}?action=get_districts`)
        .then(res => res.json())
        .then(districts => {
            const select = $('district-select');
            const seen = new Set();
            districts.forEach(d => {
                const key = String(d.name_th || '').replace(/\s+/g, '').toLowerCase();
                if (!key || seen.has(key)) return; // กันเขตซ้ำ
                seen.add(key);
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name_th;
                select.append(opt);
            });
        });

    // โหลดราคาสูงสุดจริงในระบบ มาตั้งเป็นขอบเขตสไลเดอร์
    fetch(`${apiUrl}?action=get_price_range`)
        .then(res => res.json())
        .then(range => {
            const priceMax = Math.max(Number(range.max) || 0, 100);
            ['min-price-slider', 'max-price-slider'].forEach(id => {
                $(id).min = 0;
                $(id).max = priceMax;
            });
            $('min-price-slider').value = 0;
            $('max-price-slider').value = priceMax;
            ['price-min-input', 'price-max-input'].forEach(id => {
                $(id).min = 0;
                $(id).max = priceMax;
            });
            updateSliderUI();
        });

    // ---------- สิ่งอำนวยความสะดวก (เลือกได้หลายอย่าง) ----------
    const selectedAmenities = new Set();

    fetch(`${apiUrl}?action=get_amenities`)
        .then(res => res.json())
        .then(items => {
            const menu = $('amenity-menu');
            if (!Array.isArray(items) || items.length === 0) {
                menu.innerHTML = '<div class="multi-select__empty">ยังไม่มีข้อมูลสิ่งอำนวยความสะดวก</div>';
                return;
            }
            items.forEach(item => {
                const row = document.createElement('label');
                row.className = 'multi-select__option';
                row.setAttribute('role', 'option');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = item.label;
                cb.addEventListener('change', () => {
                    cb.checked ? selectedAmenities.add(item.label) : selectedAmenities.delete(item.label);
                    updateAmenitySummary();
                    applyFilters();
                });
                const text = document.createElement('span');
                text.textContent = item.label;
                const count = document.createElement('small');
                count.textContent = item.count;
                row.append(cb, text, count);
                menu.append(row);
            });
        });

    function updateAmenitySummary() {
        const n = selectedAmenities.size;
        $('amenity-summary').textContent = n === 0
            ? 'เลือกสิ่งอำนวยความสะดวก'
            : (n <= 2 ? [...selectedAmenities].join(', ') : `เลือกแล้ว ${n} รายการ`);
        $('amenity-toggle').classList.toggle('has-value', n > 0);
    }

    function setAmenityMenu(open) {
        $('amenity-menu').hidden = !open;
        $('amenity-toggle').setAttribute('aria-expanded', String(open));
    }
    $('amenity-toggle').addEventListener('click', () => setAmenityMenu($('amenity-menu').hidden));
    document.addEventListener('click', e => {
        if (!$('amenity-select').contains(e.target)) setAmenityMenu(false);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setAmenityMenu(false); });

    // ---------- สไลเดอร์ราคา ----------
    // พิมพ์ตัวเลขเองในช่องราคา แล้วให้สไลเดอร์ตามและค้นหาใหม่
    function onPriceInputChange(which) {
        const minSlider = $('min-price-slider');
        const maxSlider = $('max-price-slider');
        const rangeMin = parseInt(minSlider.min);
        const rangeMax = parseInt(minSlider.max);

        let minVal = parseInt($('price-min-input').value);
        let maxVal = parseInt($('price-max-input').value);
        if (isNaN(minVal)) minVal = rangeMin;
        if (isNaN(maxVal)) maxVal = rangeMax;
        minVal = Math.min(Math.max(minVal, rangeMin), rangeMax);
        maxVal = Math.min(Math.max(maxVal, rangeMin), rangeMax);
        if (which === 'min' && minVal > maxVal) minVal = maxVal;
        if (which === 'max' && maxVal < minVal) maxVal = minVal;

        minSlider.value = minVal;
        maxSlider.value = maxVal;
        updateSliderUI();
        applyFilters();
    }

    function onSliderInput() {
        const minSlider = $('min-price-slider');
        const maxSlider = $('max-price-slider');
        // กันไม่ให้หัวไหนลากข้ามอีกหัวไป
        if (parseInt(minSlider.value) > parseInt(maxSlider.value)) {
            if (document.activeElement === minSlider) minSlider.value = maxSlider.value;
            else maxSlider.value = minSlider.value;
        }
        updateSliderUI();
    }

    function updateSliderUI() {
        const minSlider = $('min-price-slider');
        const maxSlider = $('max-price-slider');
        const rangeMin = parseInt(minSlider.min);
        const rangeMax = parseInt(minSlider.max);
        const minVal = parseInt(minSlider.value);
        const maxVal = parseInt(maxSlider.value);
        const span = rangeMax - rangeMin;
        const minPercent = span > 0 ? ((minVal - rangeMin) / span) * 100 : 0;
        const maxPercent = span > 0 ? ((maxVal - rangeMin) / span) * 100 : 100;

        const fill = $('range-track-fill');
        fill.style.left = minPercent + '%';
        fill.style.width = (maxPercent - minPercent) + '%';
        $('price-min-input').value = minVal;
        $('price-max-input').value = maxVal;
        $('price-min-label').textContent = `เริ่มต้น ${minVal.toLocaleString('th-TH')} บาท`;
        $('price-max-label').textContent = `สูงสุด ${maxVal.toLocaleString('th-TH')} บาท`;
    }


    // ฟังก์ชันโหลดที่พักมาแสดงในหน้า
    function loadAccommodations(url) {
        const listDiv = document.getElementById('accommodation-list');
        listDiv.innerHTML = '<div class="loading-state"><p>กำลังค้นหาและดึงข้อมูลที่พักระดับพรีเมียม...</p></div>';

        const myRequest = ++requestId;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (myRequest !== requestId) return;
                listDiv.innerHTML = '';

                if (data.error) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <p>เกิดข้อผิดพลาดในการดึงข้อมูล: ${escapeHtml(data.error)}</p>
                        </div>`;
                    return;
                }

                if(data.length === 0) {
                    listDiv.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <p>ไม่พบข้อมูลที่พักในเงื่อนไขการค้นหานี้</p>
                        </div>`;
                    return;
                }
                data.forEach(item => {
                    const imgHtml = item.cover_image
                        ? `<img class="card-image" src="${/^https?:\/\//i.test(item.cover_image) ? escapeHtml(item.cover_image) : 'uploads/' + escapeHtml(item.cover_image)}" alt="${escapeHtml(item.name)}">`
                        : `<div class="card-image-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>`;
                    listDiv.innerHTML += `
                        <div class="card">
                            ${imgHtml}
                            <div class="card-body">
                                <span class="badge">เขต${escapeHtml(item.district_name || 'ไม่ระบุ')}</span>
                                <h3>${escapeHtml(item.name)}</h3>
                                <p class="address">${escapeHtml(item.address || 'ไม่มีข้อมูลที่อยู่ระบุไว้ในระบบ')}</p>
                            </div>
                            <div class="card-footer">
                                <a class="details-link" href="${appUrl(`details.php?id=${encodeURIComponent(item.id)}`)}">ดูรายละเอียด</a>
                                <div class="price">฿${parseInt(item.price).toLocaleString()} <span>/ คืน</span></div>
                                ${item.distance ? `<div class="distance">📍 ใกล้ฉัน: ${parseFloat(item.distance).toFixed(2)} กม.</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <p>เชื่อมต่อ server ไม่ได้ ลองรีเฟรชหน้าใหม่อีกครั้ง</p>
                    </div>`;
            });
    }

    // เก็บพิกัดปัจจุบันไว้ ถ้า user เคยกด "ใกล้ตัวฉัน" แล้วจะได้รวมกับ filter อื่นได้ด้วย
    let currentLat = null;
    let currentLng = null;
    let requestId = 0; // กันผลของคำค้นเก่าที่ตอบช้ากว่ามาทับผลใหม่

    // รวม filter ทุกตัว (คำค้น, เขต, สิ่งอำนวยความสะดวก, ราคา, ตำแหน่ง) เป็น query เดียว
    function applyFilters() {
        const params = new URLSearchParams();
        const keyword = $('search-input').value.trim();
        const districtId = $('district-select').value;
        const minSlider = $('min-price-slider');
        const maxSlider = $('max-price-slider');

        if (keyword) params.set('q', keyword);
        if (districtId) params.set('district_id', districtId);
        selectedAmenities.forEach(a => params.append('amenities[]', a));
        // ส่งราคาเฉพาะตอนที่ผู้ใช้ขยับสไลเดอร์ ไม่งั้นที่พักที่ไม่มีราคาจะหายไป
        if (minSlider.value !== minSlider.min) params.set('min_price', minSlider.value);
        if (maxSlider.value !== maxSlider.max) params.set('max_price', maxSlider.value);
        if (currentLat !== null && currentLng !== null) {
            params.set('lat', currentLat);
            params.set('lng', currentLng);
        }

        const query = params.toString();
        loadAccommodations(query ? `${apiUrl}?${query}` : apiUrl);
    }

    function resetFilters() {
        $('search-input').value = '';
        $('district-select').value = '';
        selectedAmenities.clear();
        document.querySelectorAll('#amenity-menu input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateAmenitySummary();
        $('min-price-slider').value = $('min-price-slider').min;
        $('max-price-slider').value = $('max-price-slider').max;
        updateSliderUI();
        setNearby(null, null);
        applyFilters();
    }

    function setNearby(lat, lng) {
        currentLat = lat;
        currentLng = lng;
        const on = lat !== null;
        $('nearby-btn').classList.toggle('is-active', on);
        $('nearby-btn').setAttribute('aria-pressed', String(on));
        $('nearby-label').textContent = on ? 'กำลังใช้ตำแหน่งของฉัน (กดเพื่อยกเลิก)' : 'ใกล้ตัวฉัน (10 กม.)';
    }

    function toggleNearby() {
        if (currentLat !== null) { setNearby(null, null); applyFilters(); return; }
        if (!navigator.geolocation) {
            alert('เบราว์เซอร์ของคุณไม่รองรับระบบตรวจสอบพิกัดที่ตั้ง');
            return;
        }
        navigator.geolocation.getCurrentPosition(position => {
            setNearby(position.coords.latitude, position.coords.longitude);
            applyFilters();
        }, () => {
            alert('ไม่สามารถเข้าถึงตำแหน่งปัจจุบันได้ โปรดอนุญาตสิทธิ์ Location ในเบราว์เซอร์ของคุณ');
        });
    }

    // ผูก event: ทุกช่องค้นหาไปที่ applyFilters ตัวเดียวกัน จึงซิงค์กันตลอด
    let searchTimer;
    $('search-input').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 350);
    });
    $('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); applyFilters(); } });
    $('district-select').addEventListener('change', applyFilters);
    ['min-price-slider', 'max-price-slider'].forEach(id => {
        $(id).addEventListener('input', onSliderInput);
        $(id).addEventListener('change', applyFilters);
    });
    // ช่องราคา: ห้ามพิมพ์ตัวอักษร/สัญลักษณ์ (รับเฉพาะตัวเลข)
    ['price-min-input', 'price-max-input'].forEach(id => {
        $(id).addEventListener('keypress', e => { if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault(); });
        $(id).addEventListener('input', e => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
    });
    $('price-min-input').addEventListener('change', () => onPriceInputChange('min'));
    $('price-max-input').addEventListener('change', () => onPriceInputChange('max'));
    $('search-btn').addEventListener('click', () => { clearTimeout(searchTimer); applyFilters(); });
    $('reset-btn').addEventListener('click', resetFilters);
    $('nearby-btn').addEventListener('click', toggleNearby);

    window.onload = () => applyFilters();
</script>

</body>
</html>
